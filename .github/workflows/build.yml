name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    # Windows Forms solo compila en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar paquetes
        run: dotnet restore GimnasioApp.sln

      - name: Compilar (Release)
        run: dotnet build GimnasioApp.sln --configuration Release --no-restore
